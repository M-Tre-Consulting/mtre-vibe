name: Android CI/CD

on:
  push:
    tags:
      - 'v*'
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Determine Version Information
        id: versioning
        run: |
          # Compute total commits for strictly incremental versionCode
          TOTAL_COMMITS=$(git rev-list --count HEAD)
          VERSION_CODE=$TOTAL_COMMITS

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Extract exact tag name (versionName equals tag)
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION_NAME="$TAG_NAME"
            IS_RELEASE="true"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.8.0")
            VERSION_NAME="${LATEST_TAG}-dev"
            IS_RELEASE="false"
          fi

          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT

          echo "Resolved version name: $VERSION_NAME"
          echo "Resolved version code: $VERSION_CODE"
          echo "Is release build: $IS_RELEASE"

      - name: Build Debug APK
        if: steps.versioning.outputs.is_release != 'true'
        working-directory: android
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: |
          ./gradlew assembleDebug \
            -PversionName="${{ steps.versioning.outputs.version_name }}" \
            -PversionCode="${{ steps.versioning.outputs.version_code }}" \
            --no-daemon

      - name: Build Release APK
        if: steps.versioning.outputs.is_release == 'true'
        working-directory: android
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from GitHub Secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$(pwd)/release.keystore"
            export KEYSTORE_FILE="$(pwd)/release.keystore"
          fi
          ./gradlew assembleRelease \
            -PversionName="${{ steps.versioning.outputs.version_name }}" \
            -PversionCode="${{ steps.versioning.outputs.version_code }}" \
            --no-daemon

      - name: Prepare Release Artifacts
        if: steps.versioning.outputs.is_release == 'true'
        run: |
          TAG="${{ steps.versioning.outputs.version_name }}"
          RELEASE_DIR="android/app/build/outputs/apk/release"
          TARGET_APK="${RELEASE_DIR}/Vibe-${TAG}.apk"

          cp "${RELEASE_DIR}/app-release.apk" "$TARGET_APK"
          cd "${RELEASE_DIR}"
          sha256sum "Vibe-${TAG}.apk" > "Vibe-${TAG}.apk.sha256"

          echo "Generated release APK: $TARGET_APK"
          cat "Vibe-${TAG}.apk.sha256"

      - name: Upload Debug APK Artifact
        if: steps.versioning.outputs.is_release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Vibe-${{ steps.versioning.outputs.version_name }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        if: steps.versioning.outputs.is_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Vibe-${{ steps.versioning.outputs.version_name }}
          path: |
            android/app/build/outputs/apk/release/Vibe-*.apk
            android/app/build/outputs/apk/release/Vibe-*.apk.sha256
          retention-days: 30

      - name: Create GitHub Release and Publish APK
        if: steps.versioning.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.version_name }}
          name: Release ${{ steps.versioning.outputs.version_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/Vibe-*.apk
            android/app/build/outputs/apk/release/Vibe-*.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
